name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Preflight static checks
        env:
          AIGP_PREFLIGHT_STATIC_ONLY: "1"
        run: uv run preflight

      - name: Verify simulator physics metadata in snapshot
        run: uv run verify-sim-physics-metadata

      - name: MAVLink attitude smoke test
        run: uv run python scripts/smoke_attitude_integration.py
