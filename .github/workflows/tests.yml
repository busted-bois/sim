name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Run unit tests
        run: |
          uv sync --frozen
          uv run check-merge-markers
          uv run python -m unittest discover -s tests -v

      - name: Verify simulator physics metadata in snapshot
        run: uv run verify-sim-physics-metadata

      - name: Verify simulator gate_reference in snapshot
        run: uv run verify-sim-gate-reference

      - name: MAVLink attitude smoke test
        run: uv run python scripts/smoke_attitude_integration.py
