[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "aigp-drone"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "msgpack",
    "numpy",
    "opencv-python-headless>=4.8,<5",
    "pillow>=12.2.0",
    "pymavlink>=2.4.49",
]

[project.optional-dependencies]
mavlink = ["pymavlink>=2.4.49"]
manual = [
    "pyvjoy",
    "pynput",
    "PySimpleGUI<5",
]

[project.scripts]
sim = "src.sim_launch:main"
sim-very-soft = "src.sim_launch:main_very_soft"
sim-low-end = "src.sim_launch:main_low_end"
calibrate = "src.sim_launch:main_calibrate"
preflight = "src.preflight:main"
check-mavlink = "src.check_mavlink:main"
attitude-listen = "src.mavlink.attitude_listen:main"
sim-mavlink = "src.sim_launch:main_mavlink"
mavlink-all = "src.sim_launch:main_mavlink_all"
sim-restore-simpleflight = "src.sim_launch:main_restore_simpleflight"
extract-simulator-specs = "src.simulator_specs:main"
verify-sim-physics-metadata = "src.simulator_specs:main_verify_physics_metadata"
highres-imu-smoke = "src.highres_imu_smoke:main"
timesync-smoke = "src.timesync_smoke:main"
sim-timesync-smoke = "src.sim_launch:main_timesync_smoke"
attitude-smoke = "src.attitude_smoke:main"
sim-attitude-smoke = "src.sim_launch:main_attitude_smoke"

[dependency-groups]
dev = [
    "lefthook",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".venv/",
    "airsim/",
    "msgpackrpc/",
    "opensrc/",
    ".codex_worktrees/",
    "simple_airsim/",
    ".claude/",
    ".sisyphus/",
    ".ruff_cache/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
